<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor HLS en JavaScript Puro</title>
    <!-- Importar HLS.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #0f172a;
            --control-bg: rgba(15, 23, 42, 0.85);
            --text-color: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button.load-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.load-btn:hover {
            background-color: #2563eb;
        }

        /* Contenedor del Reproductor */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Barra de Controles Personalizados */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, var(--control-bg));
            padding: 20px 15px 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover .controls-overlay {
            opacity: 1;
        }

        /* Barra de Progreso */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        /* Fila inferior de controles */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--primary-color);
        }

        .volume-slider {
            width: 70px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .time-display {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-variant-numeric: tabular-nums;
        }

        /* Selector de Calidades HLS */
        .quality-select {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
    </style>
<script defer src=assets/sf-language.js></script></head>
<body>

    <h1>Reproductor HLS Personalizado</h1>

    <div class="input-container">
        <input type="text" id="streamUrl" placeholder="Introduce la URL del archivo .m3u8" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">
        <button class="load-btn" id="loadBtn">Cargar Stream</button>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" playsinline></video>

        <!-- Controles -->
        <div class="controls-overlay" id="controlsOverlay">
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="controls-row">
                <div class="controls-left">
                    <button class="control-btn" id="playPauseBtn" title="Reproducir/Pausar">â–¶</button>
                    <button class="control-btn" id="muteBtn" title="Silenciar">ðŸ”Š</button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                </div>

                <div class="controls-right">
                    <select class="quality-select" id="qualitySelect" title="Calidad">
                        <option value="-1">Auto</option>
                    </select>
                    <button class="control-btn" id="fullscreenBtn" title="Pantalla Completa">â›¶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const streamUrlInput = document.getElementById('streamUrl');
        const loadBtn = document.getElementById('loadBtn');
        const videoContainer = document.getElementById('videoContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const progressBar = document.getElementById('progressBar');
        const qualitySelect = document.getElementById('qualitySelect');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        let hls = null;

        function initPlayer(url) {
            // Destruir instancia previa de HLS si existe
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    // Poblar selector de calidades
                    qualitySelect.innerHTML = '<option value="-1">Auto</option>';
                    hls.levels.forEach((level, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `${level.height ? level.height + 'p' : 'N/A'} (${Math.round(level.bitrate / 1000)+' kbps'})`;
                        qualitySelect.appendChild(option);
                    });
                    video.play().catch(() => {});
                });

                // Manejo de cambio de calidad manual
                hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
                    qualitySelect.value = hls.currentLevel;
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte nativo (ej. Safari en macOS / iOS)
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(() => {});
                });
                qualitySelect.innerHTML = '<option value="-1">Nativo (Auto)</option>';
            } else {
                alert('Tu navegador no soporta reproducciÃ³n HLS.');
            }
        }

        // Cargar stream inicial al abrir la pÃ¡gina
        initPlayer(streamUrlInput.value);

        // BotÃ³n para cargar nueva URL
        loadBtn.addEventListener('click', () => {
            const url = streamUrlInput.value.trim();
            if (url) initPlayer(url);
        });

        // Controles de ReproducciÃ³n / Pausa
        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        video.addEventListener('play', () => { playPauseBtn.textContent = 'â¸'; });
        video.addEventListener('pause', () => { playPauseBtn.textContent = 'â–¶'; });

        // Control de Volumen y Mute
        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = (video.volume === 0);
            updateMuteIcon();
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            volumeSlider.value = video.muted ? 0 : video.volume;
            updateMuserIconState();
        });

        function updateMuteIcon() {
            if (video.muted || video.volume === 0) {
                muteBtn.textContent = 'ðŸ”‡';
            } else if (video.volume < 0.5) {
                muteBtn.textContent = 'ðŸ”‰';
            } else {
                muteBtn.textContent = 'ðŸ”Š';
            }
        }

        function updateMuserIconState() {
            updateMuteIcon();
            if (!video.muted && video.volume === 0) {
                video.volume = 0.5;
                volumeSlider.value = 0.5;
            }
        }

        // Formatear tiempo (segundos -> MM:SS)
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        video.addEventListener('timeupdate', () => {
            const current = video.currentTime;
            const duration = video.duration || 0;
            if (duration > 0) {
                const percent = (current / duration) * 100;
                progressBar.style.width = `${percent}%`;
            }
            timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        });

        // Barra de progreso interactiva (Seek)
        progressBarContainer.addEventListener('click', (e) => {
            const rect = progressBarContainer.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            if (video.duration) {
                video.currentTime = clickPosition * video.duration;
            }
        });

        // Cambio de Calidad vÃ­a Select
        qualitySelect.addEventListener('change', (e) => {
            if (hls) {
                hls.currentLevel = parseInt(e.target.value);
            }
        });

        // Pantalla Completa
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    alert(`Error al intentar modo pantalla completa: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
