ServerName localhost
Listen 8080
<VirtualHost *:8080>
    ServerName ${SPARROWFY_HOST}
    DocumentRoot /var/www/html/audio
    DirectoryIndex index.php
    <Directory /var/www/html/audio>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <DirectoryMatch "^/var/www/html/audio/(lib|scripts|backups)(/|$)">
        Require all denied
    </DirectoryMatch>
    <Directory /var/www/html/audio/data>
        Require all denied
    </Directory>
    <LocationMatch "(?i)^/data/albums/[a-f0-9]{16}/cover\.(?:jpe?g|png|webp|gif)$">
        Require all granted
    </LocationMatch>
    <FilesMatch "^(settings|lib|auth)\.php$">
        Require all denied
    </FilesMatch>
    RewriteEngine On
    RewriteRule ^/?api/v1/health$ /api/v1/index.php?r=health [END]
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
