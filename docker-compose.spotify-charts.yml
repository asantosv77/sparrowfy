# Puente opcional de Spotify Charts para el despliegue independiente.
services:
  spotify-charts:
    build:
      context: ./spotify-charts
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      TZ: ${TZ:-America/Mexico_City}
      HOST_VNC_PORT: ${SPOTIFY_VNC_PORT:-16080}
      SSH_TARGET: ${SPOTIFY_SSH_TARGET:-}
    ports:
      - "127.0.0.1:${SPOTIFY_VNC_PORT:-16080}:6080"
    volumes:
      - spotify_charts_profile:/data/profile
      - spotify_charts_state:/data
    shm_size: 512m
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s

volumes:
  spotify_charts_profile: {}
  spotify_charts_state: {}
