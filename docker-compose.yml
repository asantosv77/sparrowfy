name: sparrowfy-deploy
services:
  www:
    image: sparrowfy-deploy-www:local
    build:
      context: .
      dockerfile: images/php-imagemagic/Dockerfile
      args:
        RUNTIME_STAGE: ${RUNTIME_STAGE:-sparrowfy-dependencies}
    restart: unless-stopped
    init: true
    user: "33:33"
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8081}:8080"
    environment:
      TZ: ${TZ:-America/Mexico_City}
      SPARROWFY_HOST: ${SPARROWFY_HOST:-sparrowfy.ddns.info}
      HLS_MUSIC_LAB_SQLITE_DB: ${HLS_MUSIC_LAB_SQLITE_DB:-/sparrowfy/database/library.sqlite}
      PHP_SESSION_DIR: /var/lib/hlsml-sessions
      SPARROWFY_CRON_ENABLED: ${SPARROWFY_CRON_ENABLED:-0}
      MORNYE_API_URL: http://mornye-api:8000
      SPOTIFY_CHARTS_BRIDGE: http://spotify-charts:8099
      SPOTIFY_LOCAL_PORT: ${SPOTIFY_LOCAL_PORT:-16080}
      GENIUS_ACCESS_TOKEN: ${GENIUS_ACCESS_TOKEN:-}
      MUSIXMATCH_API_KEY: ${MUSIXMATCH_API_KEY:-}
      YT_DLP_BIN: ${YT_DLP_BIN:-/usr/local/bin/yt-dlp}
    volumes:
      - ${MEDIA_SOURCE:-media}:/sparrowfy
      - inbox:/sparrowfy/inbox
      - ${DATA_SOURCE:-app_data}:/var/www/html/audio/data
      - ${SESSION_SOURCE:-sessions}:/var/lib/hlsml-sessions
      - ${BACKUP_SOURCE:-backups}:/var/www/html/audio/backups
    healthcheck:
      test: ["CMD", "/usr/local/bin/sparrowfy-health"]
      start_period: 30s
      interval: 30s
      timeout: 8s
      retries: 3
  mornye-api:
    build: ./images/mornye
    command: ["--web", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Mexico_City}
      MORNYE_REGISTRIES: https://raw.githubusercontent.com/mornyeapp/Mornye-Extension/main/registry-unified.json
      MORNYE_PROGRESS_BARS: "0"
      MORNYE_ANIMATED_ARTWORKS_ENABLED: "0"
    ports:
      - "127.0.0.1:${MORNYE_LOCAL_PORT:-18083}:8000"
    volumes:
      - mornye_config:/config
      - inbox:/inbox
    shm_size: 512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/info', timeout=5).close()"]
      start_period: 180s
      interval: 30s
      timeout: 8s
      retries: 3
  spotify-charts:
    build: ./images/spotify-charts
    image: sparrowfy-deploy-spotify-charts:local
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-America/Mexico_City}
      PORT: "8099"
      SPOTIFY_LOCAL_PORT: ${SPOTIFY_LOCAL_PORT:-16080}
      PROFILE_DIR: /data/profile
      STATE_DIR: /data
      ALLOWED_ALIASES: regional-mx-weekly,regional-us-weekly,regional-global-weekly
    ports:
      - "127.0.0.1:${SPOTIFY_LOCAL_PORT:-16080}:6080"
    volumes:
      - spotify_state:/data
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8099/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 7s
      retries: 3
volumes:
  media: {}
  app_data: {}
  sessions: {}
  backups: {}
  inbox: {}
  mornye_config: {}
  spotify_state: {}
